/**:
  ros__parameters:
    planner_type: classic
    max_attempts: 8
    timeout: 20.0
    time_dilation_factor: 0.9
    voxel_size: 0.05
    collision_activation_distance: 0.04
    trajopt_tsteps: 24
    use_cuda_graph: true
    num_trajopt_seeds: 8
    num_graph_seeds: 8
    interpolation_steps: 4000
    interpolation_dt: 0.03
    acceleration_scale: 1.0
    self_collision_check: true
    maximum_trajectory_dt: 0.35
    finetune_dt_scale: 1.05
    fixed_iters_trajopt: true
    finetune_trajopt_iters: 220
    minimize_jerk: true

    curobo_configure_collision_cache: true
    curobo_collision_cache_obb: 64
    curobo_collision_cache_mesh: 4
    curobo_collision_cache_blox: 4
    curobo_world_mesh_as_cuboid: true
    curobo_world_max_mesh_geometries_per_object: 8
    curobo_world_max_concurrent_adds: 8
    curobo_world_use_move_updates: true
    curobo_world_max_move_batch_size: 128
    visualize_collision_world: true
    visualize_robot_collision_spheres: true
    robot_collision_sphere_alpha: 0.5
    robot_collision_sphere_rate_hz: 10.0
    collision_marker_alpha: 0.22
    environment_publish_rate_hz: 30.0
    environment_startup_delay_sec: 3.0
    environment_collision_padding: 0.000
    environment_pose_position_tolerance_m: 0.002
    environment_pose_orientation_tolerance_rad: 0.02
    environment_dimensions_tolerance_m: 0.001

    # MPC tuning
    convergence_threshold: 0.02
    mpc_position_convergence_threshold: 0.01
    mpc_rotation_convergence_threshold: 0.1
    mpc_joint_convergence_threshold: 0.07
    mpc_classic_handoff_enabled: true
    mpc_classic_handoff_distance: 0.05
    mpc_step_dt: 0.03
    mpc_horizon_steps: 16
    mpc_force_shift_steps_one: true
    mpc_command_speed_scale: 0.9
    max_mpc_iterations: 1000
    mpc_step_max_attempts: 2
    mpc_execution_interface: stream_position
    mpc_stream_controller_name: forward_position_controller
    mpc_stream_controller_topic: /forward_position_controller/commands
    mpc_deactivate_controller_name: joint_trajectory_controller
    controller_manager_switch_service: /controller_manager/switch_controller
    mpc_infeasible_abort_steps: 5
    hybrid_mpc_report_path_invalidated: true
    hybrid_mpc_stall_steps: 50
    hybrid_mpc_stall_threshold: 0.003
    hybrid_path_sentinel_enabled: true
    hybrid_path_sentinel_safety_margin_m: 0.08
    hybrid_path_sentinel_collision_epsilon_m: 0.001
    hybrid_path_sentinel_only_after_world_update: true
